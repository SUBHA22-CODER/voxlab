name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_speech_tests:
        description: "Run real speech-engine integration tests (downloads the tiny Whisper model)"
        type: boolean
        default: false

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      # Base CI stays hermetic: no models, no speech extra. Real-engine tests
      # run separately (see speech-integration job, manual trigger only).
      - name: Run Backend Tests (offline suite)
        run: |
          cd backend
          pytest -v -m "not speech"

  speech-integration:
    if: ${{ github.event.inputs.run_speech_tests == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend + speech dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-speech.txt
          pip install pytest pytest-asyncio httpx

      - name: Run real speech-engine integration tests
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: |
          cd backend
          pytest -v -m speech

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Next.js App
        run: |
          cd frontend
          npm run build
