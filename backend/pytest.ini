[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = --strict-markers -p no:cacheprovider
markers =
    integration: end-to-end tests across the API and engine
    speech: requires the faster-whisper runtime (opt-in; downloads a model on first run)
